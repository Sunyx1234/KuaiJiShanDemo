[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/work-orders"
  to = "/.netlify/functions/work-orders"
  status = 200

[[redirects]]
  from = "/api/video-urls"
  to = "/.netlify/functions/video-urls"
  status = 200
