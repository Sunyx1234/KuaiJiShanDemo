<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>会稽山园区 · v2 细化对比</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;color:#263937;background:#c0cdcf}canvas{display:block;width:100vw;height:100vh;touch-action:none}
    header{position:absolute;top:26px;left:30px;pointer-events:none}small{font-size:10px;letter-spacing:3px}h1{font-size:25px;font-weight:500;margin:7px 0}header p{font-size:12px;margin:0;color:#48635e}
    nav{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);display:flex;gap:6px;padding:8px;background:#fffef1e8;border:1px solid #ffffff90;border-radius:14px;box-shadow:0 8px 25px #24392e20;white-space:nowrap}
    button{font:inherit;font-size:12px;padding:10px 14px;border:0;border-radius:8px;background:transparent;color:inherit;cursor:pointer}button:hover{background:#e8eade}button[aria-pressed=true]{background:#d8e3cc;color:#294a2c}button:disabled{opacity:.45;cursor:wait}.sep{border-left:1px solid #cdd3c7;margin:5px}
    #status{position:absolute;top:28px;right:28px;background:#fffff1e8;border-radius:10px;padding:12px 16px;font-size:12px;line-height:1.7;text-align:right}#hint{position:absolute;bottom:6px;width:100%;text-align:center;font-size:10px;color:#4a625e}
    @media(max-width:700px){header{top:14px;left:16px}h1{font-size:18px}#status{top:95px;right:14px}nav{bottom:28px;gap:0;padding:4px}button{padding:9px 7px;font-size:11px}}
  </style>
</head>
<body>
  <header><small>HUIJISHAN · MODEL REVIEW</small><h1>会稽山园区 · 首轮细化</h1><p>主厂房、道路与绿化 · 实际 Three.js 渲染</p></header>
  <div id="status" role="status">正在加载 v2 模型…</div>
  <nav aria-label="模型对比与视角"><button id="v1" aria-pressed="false">原模型 v1</button><button id="v2" aria-pressed="true">细化 v2</button><i class="sep"></i><button data-view="sample" aria-pressed="true">主厂房</button><button data-view="facade" aria-pressed="false">立面近景</button><button data-view="overview" aria-pressed="false">全园区</button><button id="tour" aria-pressed="false">缓慢环绕</button></nav>
  <div id="hint">拖动旋转 · 滚轮缩放 · 右键平移；切换版本保持相同镜头与光照</div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
    const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
    renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.toneMapping=THREE.AgXToneMapping;renderer.toneMappingExposure=1.1;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFShadowMap;renderer.shadowMap.autoUpdate=false;document.body.prepend(renderer.domElement);
    const scene=new THREE.Scene();scene.background=new THREE.Color('#b5c3c7');
    const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.2,2400);
    const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.07;controls.maxPolarAngle=Math.PI*.48;controls.minDistance=15;controls.maxDistance=1100;controls.autoRotateSpeed=.22;
    scene.add(new THREE.HemisphereLight(0xdce8f1,0x7b806d,1.1));
    const sun=new THREE.DirectionalLight(0xfff0d8,3.2);sun.position.set(-330,390,160);sun.target.position.set(-95,0,-15);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.normalBias=.12;sun.shadow.bias=-.00003;Object.assign(sun.shadow.camera,{left:-300,right:300,top:300,bottom:-300,near:10,far:1000});sun.shadow.camera.updateProjectionMatrix();scene.add(sun,sun.target);
    const pmrem=new THREE.PMREMGenerator(renderer),room=new RoomEnvironment();const env=pmrem.fromScene(room);scene.environment=env.texture;scene.environmentIntensity=.45;room.dispose();pmrem.dispose();
    const status=document.querySelector('#status'),cache=new Map(),buttons=[...document.querySelectorAll('nav button')];let current=null,version='v2',loading=false,loadId=0,frames=0,start=performance.now(),fps=0;
    const presets={sample:{position:[-275,128,115],target:[-153,6,-42]},facade:{position:[-249,34,36],target:[-164,8,-12]},overview:{position:[-275,360,460],target:[-12,0,-8]}};
    function view(name){const p=presets[name];camera.position.fromArray(p.position);controls.target.fromArray(p.target);controls.update();document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===name)));}
    function refreshStatus(){if(!loading)status.innerHTML=`${version==='v2'?'细化模型 v2':'原模型 v1'}<br>${Math.round(renderer.info.render.triangles/1000)} 千三角形 · ${renderer.info.render.calls} 次绘制<br>本机预览约 ${fps} FPS`;}
    async function load(v){if(loading)return;version=v;loading=true;const id=++loadId;buttons.forEach(b=>b.disabled=true);status.textContent=`正在加载 ${v} 模型…`;
      try{let object=cache.get(v);if(!object){const gltf=await new GLTFLoader().loadAsync(`/assets/models/huijishan-campus-${v}.glb`);object=gltf.scene;object.traverse(o=>{if(!o.isMesh)return;o.castShadow=!/^(00|01|07|13)/.test(o.name)&&!o.name.includes('种植土');o.receiveShadow=true;for(const m of(Array.isArray(o.material)?o.material:[o.material])){for(const value of Object.values(m)){if(value?.isTexture)value.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());}}});cache.set(v,object);}
        if(id!==loadId)return;if(current)scene.remove(current);current=object;scene.add(current);renderer.shadowMap.needsUpdate=true;document.querySelector('#v1').setAttribute('aria-pressed',String(v==='v1'));document.querySelector('#v2').setAttribute('aria-pressed',String(v==='v2'));loading=false;refreshStatus();
      }catch(e){loading=false;status.textContent=`模型加载失败：${e.message}`;console.error(e);}finally{buttons.forEach(b=>b.disabled=false);}}
    document.querySelector('#v1').onclick=()=>load('v1');document.querySelector('#v2').onclick=()=>load('v2');document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>view(b.dataset.view));
    document.querySelector('#tour').onclick=e=>{controls.autoRotate=!controls.autoRotate;e.currentTarget.setAttribute('aria-pressed',String(controls.autoRotate));};
    document.addEventListener('visibilitychange',()=>{start=performance.now();frames=0;});
    addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
    const timer=new THREE.Timer();renderer.setAnimationLoop(()=>{if(document.hidden)return;timer.update();controls.update(timer.getDelta());renderer.render(scene,camera);frames++;const now=performance.now();if(now-start>1500){fps=Math.round(frames*1000/(now-start));frames=0;start=now;refreshStatus();}});
    view('sample');load('v2');
  </script>
</body>
</html>
