<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>会稽山园区 · v8 园区夜景照明</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;color:#e1edfa;background:#071220}canvas{display:block;width:100vw;height:100vh;touch-action:none}
    header{position:absolute;top:26px;left:30px;pointer-events:none;background:#0a192ddd;border-radius:12px;padding:12px 16px}small{font-size:10px;letter-spacing:3px}h1{font-size:25px;font-weight:500;margin:7px 0}header p{font-size:12px;margin:0;color:#9db4d0}
    nav{max-width:1180px;overflow-x:auto;position:absolute;bottom:28px;left:50%;transform:translateX(-50%);display:flex;flex-wrap:wrap;justify-content:center;width:calc(100vw - 32px);gap:4px;padding:8px;background:#0b1a2ded;border:1px solid #80bbff40;border-radius:14px;box-shadow:0 8px 25px #24392e20;white-space:nowrap}
    button{font:inherit;font-size:12px;padding:10px 14px;border:0;border-radius:8px;background:transparent;color:inherit;cursor:pointer}button:hover{background:#234059}button[aria-pressed=true]{background:#1d5080;color:#e9f4ff}button:disabled{opacity:.45;cursor:wait}.sep{border-left:1px solid #cdd3c7;margin:5px}
    #status{position:absolute;top:28px;right:28px;background:#0a192ddd;border-radius:10px;padding:12px 16px;font-size:12px;line-height:1.7;text-align:right}#hint{position:absolute;bottom:6px;width:100%;text-align:center;font-size:10px;color:#9fb4c8}
    @media(max-width:700px){header{top:14px;left:16px}h1{font-size:18px}#status{top:95px;right:14px}nav{bottom:28px;gap:0;padding:4px}button{padding:9px 7px;font-size:11px}}
  </style>
</head>
<body>
  <header><small>HUIJISHAN · MODEL REVIEW</small><h1>会稽山园区 · 园区夜景照明</h1><p>冷暖光 · 蓝色檐线 · 材质反射 · 柔和阴影 · 实际 Three.js 渲染</p></header>
  <div style="position:absolute;top:144px;left:30px;background:#0a192ddd;padding:10px 14px;border-radius:10px;font-size:12px">曝光 <input id="exposure" aria-label="曝光" type="range" min="0.6" max="1.6" value="1.0" step="0.05" style="vertical-align:middle;width:130px"></div><div id="status" role="status">正在加载 v8 模型…</div>
  <nav aria-label="模型对比与视角"><button id="v7" aria-pressed="false">日间 v7</button><button id="v8" aria-pressed="true">夜景 v8</button><i class="sep"></i><button data-view="sample" aria-pressed="true">主厂房</button><button data-view="facade" aria-pressed="false">立面近景</button><button data-view="overview" aria-pressed="false">全园区</button><button data-view="production" aria-pressed="false">生产车间</button><button data-view="utilities" aria-pressed="false">东北设施</button><button data-view="courtyard" aria-pressed="false">东院近景</button><button data-view="entrance" aria-pressed="false">入口近景</button><button data-view="top" aria-pressed="false">东院俯视</button><button data-view="river" aria-pressed="false">滨河近景</button><button id="bloom-toggle" aria-pressed="true">柔光</button><button id="ao-toggle" aria-pressed="true">接触阴影</button><button id="lights-toggle" aria-pressed="true">景观灯</button><button id="reference">目标图</button><button id="tour" aria-pressed="false">缓慢环绕</button></nav>
  <div id="reference-panel" style="display:none;position:absolute;inset:7%;background:#102030f5;padding:16px;border-radius:12px;z-index:5"><button id="close-reference" style="color:white;float:right">关闭目标图</button><img src="/assets/campus-target-reference.png" style="width:100%;height:90%;object-fit:contain" alt="用户提供的建筑目标图"></div><div id="hint">拖动旋转 · 滚轮缩放 · 右键平移；切换日间 / 夜景保持相同镜头</div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { Water } from 'three/addons/objects/Water.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { SSAOPass } from 'three/addons/postprocessing/SSAOPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
    const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
    renderer.setPixelRatio(Math.min(devicePixelRatio,1.25));renderer.setSize(innerWidth,innerHeight);renderer.toneMapping=THREE.AgXToneMapping;renderer.toneMappingExposure=1.1;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFShadowMap;renderer.shadowMap.autoUpdate=false;document.body.prepend(renderer.domElement);
    const scene=new THREE.Scene();scene.background=new THREE.Color('#8398b0');
    const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.2,2400);
    const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.07;controls.maxPolarAngle=Math.PI*.48;controls.minDistance=15;controls.maxDistance=1100;controls.autoRotateSpeed=.22;
    const hemisphere=new THREE.HemisphereLight(0xc5dbfa,0x586578,.65);scene.add(hemisphere);
    const sun=new THREE.DirectionalLight(0xd6e5ff,2.8);sun.position.set(-190,250,120);sun.target.position.set(-95,0,-15);sun.castShadow=true;sun.shadow.mapSize.set(4096,4096);sun.shadow.normalBias=.035;sun.shadow.bias=-.00003;Object.assign(sun.shadow.camera,{left:-300,right:300,top:300,bottom:-300,near:10,far:1000});sun.shadow.camera.updateProjectionMatrix();scene.add(sun,sun.target);
    const pmrem=new THREE.PMREMGenerator(renderer),room=new RoomEnvironment();const env=pmrem.fromScene(room);scene.environment=env.texture;scene.environmentIntensity=.3;room.dispose();pmrem.dispose();
    const hdrTarget=new THREE.WebGLRenderTarget(innerWidth*renderer.getPixelRatio(),innerHeight*renderer.getPixelRatio(),{type:THREE.HalfFloatType,samples:4});const composer=new EffectComposer(renderer,hdrTarget);composer.addPass(new RenderPass(scene,camera));
    const ao=new SSAOPass(scene,camera,innerWidth,innerHeight,8);ao.kernelRadius=1.3;ao.minDistance=.002;ao.maxDistance=.045;composer.addPass(ao);
    const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),.17,.12,1.5);composer.addPass(bloom);composer.addPass(new OutputPass());
    let fixtureData=[],pools=null,lampsOn=true,lastLightUpdate=0;
    const pointPool=Array.from({length:12},()=>{const p=new THREE.PointLight(0xffc080,0,32,2);scene.add(p);return p});
    const poolMaterial=new THREE.ShaderMaterial({transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,uniforms:{color:{value:new THREE.Color(1,.39,.075)},strength:{value:.40}},vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',fragmentShader:'varying vec2 vUv;uniform vec3 color;uniform float strength;void main(){float d=length((vUv-.5)*2.0);float a=pow(max(0.0,1.0-d),2.4)*strength;gl_FragColor=vec4(color,a);}'});
    async function buildFixtures(){fixtureData=(await (await fetch('/assets/models/huijishan-lighting-v8.json')).json()).fixtures;pools=new THREE.Group();
      for(const f of fixtureData){const p=new THREE.Mesh(new THREE.PlaneGeometry(f.kind==='street'?22:11,f.kind==='street'?16:9),poolMaterial);p.rotation.x=-Math.PI/2;p.position.set(f.position[0],.27,-f.position[1]);pools.add(p);}scene.add(pools);setLighting();}
    function updateLocalLights(){if(version!=='v8'||!lampsOn){pointPool.forEach(p=>p.intensity=0);return;}
      const distant=camera.position.distanceTo(controls.target)>260;
      const ordered=distant?fixtureData.filter((f,i)=>i%7===0).slice(0,12):[...fixtureData].sort((a,b)=>new THREE.Vector3(a.position[0],a.position[2],-a.position[1]).distanceToSquared(controls.target)-new THREE.Vector3(b.position[0],b.position[2],-b.position[1]).distanceToSquared(controls.target)).slice(0,12);
      pointPool.forEach((p,i)=>{const f=ordered[i];if(!f){p.intensity=0;return;}p.position.set(f.position[0],f.position[2],-f.position[1]);p.color.setRGB(...f.color);p.intensity=f.power/(4*Math.PI);});
    }
    function setLighting(){const night=version==='v8';scene.background.set(night?'#061323':'#8398b0');scene.fog=night?new THREE.FogExp2('#08162a',.00048):null;
      hemisphere.color.set(night?0x668fcb:0xc5dbfa);hemisphere.groundColor.set(night?0x131b2e:0x586578);hemisphere.intensity=night?.20:.65;
      sun.color.set(night?0x81acff:0xd6e5ff);sun.intensity=night?.72:2.8;scene.environmentIntensity=night?.075:.3;renderer.toneMappingExposure=night?Number(document.querySelector('#exposure').value):1.1;
      if(pools)pools.visible=night&&lampsOn;if(current)current.traverse(o=>{if(o.isMesh){for(const m of(Array.isArray(o.material)?o.material:[o.material]))if(m.name==='V8 暖白灯具')m.emissiveIntensity=lampsOn?5:0;}});updateLocalLights();renderer.shadowMap.needsUpdate=true;
    }
    document.querySelector('#exposure').oninput=()=>setLighting();
    document.querySelector('#bloom-toggle').onclick=e=>{bloom.enabled=!bloom.enabled;e.currentTarget.setAttribute('aria-pressed',String(bloom.enabled));};
    document.querySelector('#ao-toggle').onclick=e=>{ao.enabled=!ao.enabled;e.currentTarget.setAttribute('aria-pressed',String(ao.enabled));};
    document.querySelector('#lights-toggle').onclick=e=>{lampsOn=!lampsOn;e.currentTarget.setAttribute('aria-pressed',String(lampsOn));setLighting();};
    const status=document.querySelector('#status'),cache=new Map(),buttons=[...document.querySelectorAll('nav button')];let transition=null;const waterMaps=new Set(),waterSurfaces=[];let current=null,version='v8',loading=false,loadId=0,frames=0,start=performance.now(),fps=0;
    const presets={production:{position:[56,140,150],target:[43,8,-42]},utilities:{position:[261,113,-5],target:[164,9,-101]},entrance:{position:[-70,89,159],target:[-20,5,48]},courtyard:{position:[213,114,198],target:[133,4,51]},top:{position:[133,181,51],target:[133,0,50]},river:{position:[-102,73,173],target:[-22,2,83]},sample:{position:[-275,128,115],target:[-153,6,-42]},facade:{position:[-249,34,36],target:[-164,8,-12]},overview:{position:[-5,395,525],target:[-5,0,-25]}};
    function view(name){const p=presets[name];transition={position:new THREE.Vector3().fromArray(p.position),target:new THREE.Vector3().fromArray(p.target)};document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===name)));}
    controls.addEventListener('start',()=>transition=null);
    function prepareVegetation(root){
      root.updateMatrixWorld(true);const tagged=[];root.traverse(o=>{if(o.userData.vegetation_instance)tagged.push(o)});const groups=new Map();
      for(const node of tagged){node.traverse(o=>{if(!o.isMesh)return;const key=o.geometry.uuid+'|'+o.material.uuid;let g=groups.get(key);if(!g){g={geometry:o.geometry,material:o.material,matrices:[]};groups.set(key,g);}g.matrices.push(o.matrixWorld.clone());});}
      for(const node of tagged)node.removeFromParent();
      for(const g of groups.values()){const o=new THREE.InstancedMesh(g.geometry,g.material,g.matrices.length);g.matrices.forEach((m,i)=>o.setMatrixAt(i,m));o.instanceMatrix.needsUpdate=true;o.computeBoundingSphere();o.name='v8 vegetation instances';o.castShadow=true;o.receiveShadow=true;root.add(o);}
    }
    function prepareWater(root,v){
      const eastShift=22;
      let normal=null;root.traverse(o=>{if(o.isMesh&&o.material?.name?.includes('水道青绿')){normal=o.material.normalMap;o.visible=false;}});if(!normal)return;
      const shape=new THREE.Shape();shape.moveTo(-230,-96.6);shape.lineTo(209.3+eastShift,-96.6);shape.lineTo(209.3+eastShift,119.6);shape.lineTo(193.2+eastShift,119.6);shape.lineTo(193.2+eastShift,-78.2);shape.lineTo(-230,-78.2);shape.closePath();
      const water=new Water(new THREE.ShapeGeometry(shape),{textureWidth:512,textureHeight:512,waterNormals:normal,sunDirection:sun.position.clone().sub(sun.target.position).normalize(),sunColor:v==='v8'?0x355275:0xd6e5ff,waterColor:v==='v8'?0x071e30:0x24544d,distortionScale:.8});
      water.rotation.x=-Math.PI/2;water.position.y=.165;water.material.uniforms.size.value=3;water.receiveShadow=true;water.name='v8 river reflection';root.add(water);waterSurfaces.push(water);
    }
    function refreshStatus(){if(!loading)status.innerHTML=`${version==='v8'?'园区夜景照明 v8':'日间 v7'}<br>冷暖光与材质 · 夜景调校<br>本机预览约 ${fps} FPS`;}
    async function load(v){if(loading)return;version=v;loading=true;const id=++loadId;buttons.forEach(b=>b.disabled=true);status.textContent=`正在加载 ${v} 模型…`;
      try{let object=cache.get(v);if(!object){const gltf=await new GLTFLoader().loadAsync(`/assets/models/huijishan-campus-${v}.glb`);object=gltf.scene;prepareVegetation(object);object.traverse(o=>{if(!o.isMesh)return;o.castShadow=!o.name.includes('浅灰场地')&&!o.name.includes('水道')&&!o.name.includes('种植土')&&!o.name.includes('道路');o.receiveShadow=true;for(const m of(Array.isArray(o.material)?o.material:[o.material])){if(m.name.includes('水道青绿')&&m.normalMap){m.normalScale.set(.45,.45);m.envMapIntensity=1.3;waterMaps.add(m.normalMap);}for(const value of Object.values(m)){if(value?.isTexture)value.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());}}});prepareWater(object,v);cache.set(v,object);}
        if(id!==loadId)return;if(current)scene.remove(current);current=object;scene.add(current);setLighting();renderer.shadowMap.needsUpdate=true;document.querySelector('#v7').setAttribute('aria-pressed',String(v==='v7'));document.querySelector('#v8').setAttribute('aria-pressed',String(v==='v8'));loading=false;refreshStatus();
      }catch(e){loading=false;status.textContent=`模型加载失败：${e.message}`;console.error(e);}finally{buttons.forEach(b=>b.disabled=false);}}
    document.querySelector('#v7').onclick=()=>load('v7');document.querySelector('#v8').onclick=()=>load('v8');document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>view(b.dataset.view));
    document.querySelector('#reference').onclick=()=>document.querySelector('#reference-panel').style.display='block'; document.querySelector('#close-reference').onclick=()=>document.querySelector('#reference-panel').style.display='none';
    document.querySelector('#tour').onclick=e=>{controls.autoRotate=!controls.autoRotate;e.currentTarget.setAttribute('aria-pressed',String(controls.autoRotate));};
    document.addEventListener('visibilitychange',()=>{start=performance.now();frames=0;});
    addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight);});
    const timer=new THREE.Timer();renderer.setAnimationLoop(()=>{if(document.hidden)return;timer.update();const dt=Math.min(timer.getDelta(),.05);if(transition){const t=1-Math.exp(-dt*5);camera.position.lerp(transition.position,t);controls.target.lerp(transition.target,t);if(camera.position.distanceTo(transition.position)<.03)transition=null;}for(const map of waterMaps){map.offset.x+=dt*.007;map.offset.y+=dt*.004;}for(const water of waterSurfaces)water.material.uniforms.time.value+=dt*.15;controls.update(dt);if(performance.now()-lastLightUpdate>500){updateLocalLights();lastLightUpdate=performance.now();}composer.render();frames++;const now=performance.now();if(now-start>1500){fps=Math.round(frames*1000/(now-start));frames=0;start=now;refreshStatus();}});
    camera.position.fromArray(presets.overview.position);controls.target.fromArray(presets.overview.target);controls.update();view('overview');buildFixtures().catch(console.error);load('v8');
  </script>
</body>
</html>
